name: Production Read-Only Smoke

on:
  workflow_dispatch:
  schedule:
    # 08:15 Europe/Istanbul (UTC+3 all year). Scheduled Actions may be delayed.
    - cron: '15 5 * * *'
  push:
    branches: [main]
    paths:
      - tests/production-smoke.mjs
      - .github/workflows/production-smoke.yml

permissions:
  contents: read

concurrency:
  group: paki-live-smoke
  cancel-in-progress: false

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node syntax check
        run: node --check tests/production-smoke.mjs
      - name: Production safe smoke
        run: node tests/production-smoke.mjs
      - name: Upload evidence even when smoke fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-evidence
          path: test-results/production-smoke.json
          if-no-files-found: warn
          retention-days: 14
# Read-only checks don't verify actual signup/email delivery/password login.
