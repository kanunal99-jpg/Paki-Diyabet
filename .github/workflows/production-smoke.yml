name: Production Read-Only Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tests/production-smoke.mjs
      - .github/workflows/production-smoke.yml

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node syntax check
        run: node --check tests/production-smoke.mjs
      - name: Production safe smoke
        run: node tests/production-smoke.mjs
      - name: Upload evidence even when smoke fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-evidence
          path: test-results/production-smoke.json
          if-no-files-found: warn
          retention-days: 14
