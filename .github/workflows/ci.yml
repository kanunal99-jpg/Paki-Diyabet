name: Source, Test and Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Do not trigger a known-incomplete full build for documentation-only edits.
    # Source/build/deployment changes must still pass this gate.
    paths:
      - 'app/**'
      - 'src/**'
      - 'pages/**'
      - 'lib/**'
      - 'db/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'npm-shrinkwrap.json'
      - 'tsconfig.json'
      - 'next.config.*'
      - 'netlify.toml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete original application source
        run: node scripts/verify-source.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Require explicit quality scripts (never silently skip)
        run: |
          node -e "const p=require('./package.json');const required=['build','lint','typecheck','test','test:e2e'];const missing=required.filter(x=>!p.scripts?.[x]);if(missing.length){console.error('QUALITY_SCRIPTS_MISSING:',missing.join(','));process.exit(1)}"
      - name: Install exact locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium test browser
        run: npx playwright install --with-deps chromium
      - name: E2E login, registration, session and isolation
        run: npm run test:e2e
      - name: Upload E2E evidence if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
# This intentionally fails on the current partial source checkout. Do not
# weaken checks, claim a green build, or link the incomplete repo to production.
